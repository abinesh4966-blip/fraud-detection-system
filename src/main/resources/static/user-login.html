<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Customer Login - Harmonia Bank</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:wght@500;600&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(160deg, #eef7f4 0%, #f2ebe3 45%, #f7f3ea 100%);
            font-family: 'DM Sans', sans-serif; color: #2c2926;
            display: flex; align-items: center; justify-content: center; padding: 24px;
            animation: pageIn 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        @keyframes pageIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .box {
            width: 100%; max-width: 420px; background: #fff9f3;
            border: 1px solid #e5d8cc; border-radius: 20px; padding: 32px 26px;
            box-shadow: 0 12px 32px rgba(44, 41, 38, 0.07);
            animation: cardIn 0.65s cubic-bezier(0.22, 1, 0.36, 1) 0.08s both;
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(18px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .logo {
            width: 48px; height: 48px; margin: 0 auto 14px; border-radius: 14px;
            background: linear-gradient(145deg, #4a6b5c, #3a5649); color: #fff;
            display: grid; place-items: center; font-family: 'Fraunces', serif;
            font-size: 20px; font-weight: 700;
        }
        h1 { font-family: 'Fraunces', serif; font-size: 24px; margin-bottom: 6px; text-align: center; }
        .sub { color: #7a7168; font-size: 14px; margin-bottom: 22px; text-align: center; }
        label { display: block; font-size: 12px; font-weight: 600; color: #7a7168; margin-bottom: 6px; }
        input {
            width: 100%; padding: 12px 14px; border: 1px solid #e5d8cc; border-radius: 10px;
            background: #fff; font-size: 14px; margin-bottom: 14px; font-family: inherit;
        }
        input:focus { outline: none; border-color: #4a6b5c; box-shadow: 0 0 0 3px rgba(74, 107, 92, 0.12); }
        .captcha-box {
            background: #f6efe7; border: 1px solid #e5d8cc; border-radius: 12px;
            padding: 14px; margin-bottom: 16px;
        }
        .captcha-q { font-weight: 600; margin-bottom: 8px; font-size: 14px; }
        button {
            width: 100%; padding: 13px; border: none; border-radius: 10px;
            background: #4a6b5c; color: white; font-weight: 700; font-size: 14px;
            cursor: pointer; font-family: inherit;
        }
        button:hover { background: #3a5649; }
        .msg { margin-top: 12px; font-size: 13px; text-align: center; display: none; }
        .msg.error { color: #b54a3c; display: block; }
        .msg.ok { color: #3d7a5a; display: block; }
        .links { margin-top: 18px; text-align: center; font-size: 13px; color: #7a7168; }
        .links a { color: #4a6b5c; text-decoration: none; font-weight: 600; }
        .guide { font-size: 12px; color: #a89b8f; margin: -6px 0 14px; line-height: 1.4; }
    </style>
</head>
<body>
    <div class="box">
        <div class="logo">H</div>
        <h1>Customer Login</h1>
        <p class="sub">Access your account securely</p>

        <div id="captchaSection">
            <div class="captcha-box">
                <div class="captcha-q" id="captchaQuestion">Loading...</div>
                <label>Security check</label>
                <input type="number" id="captchaAnswer" placeholder="Enter the answer">
                <button type="button" onclick="verifyCaptcha()">Continue</button>
            </div>
            <div class="msg" id="captchaMsg"></div>
        </div>

        <form id="loginForm" style="display:none;" onsubmit="login(event)">
            <label>Username</label>
            <input type="text" id="username" required>
            <label>Password</label>
            <input type="password" id="password" required>
            <div class="guide">Min 8 chars, uppercase, number, special character</div>
            <button type="submit">Sign in</button>
            <div class="msg" id="msg"></div>
        </form>

        <div class="links">
            New customer? <a href="user-register.html">Create account</a><br>
            <a href="access.html">Back to access options</a>
        </div>
    </div>

    <script>
        let captchaA = 0, captchaB = 0;
        function newCaptcha() {
            captchaA = Math.floor(Math.random() * 9) + 2;
            captchaB = Math.floor(Math.random() * 9) + 2;
            document.getElementById("captchaQuestion").textContent = "What is " + captchaA + " + " + captchaB + "?";
            document.getElementById("captchaAnswer").value = "";
        }
        function verifyCaptcha() {
            const ans = parseInt(document.getElementById("captchaAnswer").value, 10);
            const msg = document.getElementById("captchaMsg");
            if (ans === captchaA + captchaB) {
                document.getElementById("captchaSection").style.display = "none";
                document.getElementById("loginForm").style.display = "block";
            } else {
                msg.className = "msg error";
                msg.textContent = "Incorrect answer. Try again.";
                newCaptcha();
            }
        }
        async function login(e) {
            e.preventDefault();
            const msg = document.getElementById("msg");
            msg.className = "msg"; msg.textContent = "";
            try {
                const res = await fetch("http://localhost:8080/api/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        username: document.getElementById("username").value.trim(),
                        password: document.getElementById("password").value,
                        role: "USER"
                    })
                });
                const data = await res.json();
                if (data.success) {
                    sessionStorage.setItem("isLoggedIn", "true");
                    sessionStorage.setItem("role", data.role);
                    sessionStorage.setItem("fullName", data.fullName || data.username);
                    sessionStorage.setItem("username", data.username);
                    sessionStorage.setItem("accountNumber", data.accountNumber || "");
                    sessionStorage.setItem("token", data.token || "");
                    msg.className = "msg ok";
                    msg.textContent = "Login successful...";
                    setTimeout(() => window.location.href = "user-dashboard.html", 700);
                } else {
                    msg.className = "msg error";
                    msg.textContent = data.message || "Login failed";
                }
            } catch {
                msg.className = "msg error";
                msg.textContent = "Cannot connect to server. Is Spring Boot running?";
            }
        }
        newCaptcha();
    </script>
</body>
</html>
