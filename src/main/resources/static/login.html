<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login - Fraud Detection System</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Rajdhani:wght@400;500;600;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #05070f;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(0, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }

        .login-box {
            position: relative;
            z-index: 5;
            background: rgba(12, 18, 35, 0.9);
            border: 1px solid rgba(0, 255, 255, 0.25);
            border-radius: 16px;
            padding: 40px 36px;
            width: 400px;
            backdrop-filter: blur(14px);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 240, 255, 0.08);
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            color: #00f0ff;
            font-size: 20px;
            text-align: center;
            letter-spacing: 2px;
            margin-bottom: 6px;
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }

        .subtitle {
            text-align: center;
            color: #7f8ea3;
            font-size: 13px;
            margin-bottom: 28px;
            letter-spacing: 1px;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 12px;
            color: #7f8ea3;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .input-group input {
            width: 100%;
            padding: 12px 14px;
            background: rgba(5, 10, 25, 0.8);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 8px;
            color: #e0e6ed;
            font-size: 14px;
            font-family: 'Rajdhani', sans-serif;
        }

        .input-group input:focus {
            outline: none;
            border-color: #00f0ff;
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.2);
        }

        .password-guide {
            background: rgba(0, 255, 255, 0.04);
            border: 1px solid rgba(0, 255, 255, 0.12);
            border-radius: 8px;
            padding: 12px 14px;
            margin-bottom: 18px;
            font-size: 12px;
            color: #7f8ea3;
        }

        .password-guide strong {
            display: block;
            margin-bottom: 6px;
            color: #a0aec0;
        }

        .password-guide ul {
            padding-left: 16px;
        }

        .password-guide li {
            margin: 2px 0;
        }

        button {
            width: 100%;
            padding: 13px;
            background: linear-gradient(90deg, #00b0ff, #00e5ff);
            color: #001a22;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            font-family: 'Rajdhani', sans-serif;
            cursor: pointer;
            letter-spacing: 1px;
            transition: 0.25s;
        }

        button:hover {
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.4);
        }

        .error {
            color: #ff5252;
            font-size: 13px;
            margin-top: 14px;
            text-align: center;
            display: none;
        }

        .register-link {
            text-align: center;
            margin-top: 22px;
            font-size: 13px;
            color: #7f8ea3;
        }

        .register-link a {
            color: #00f0ff;
            text-decoration: none;
            font-weight: 600;
        }

        .register-link a:hover {
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.5);
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>SECURE ACCESS</h1>
        <p class="subtitle">FRAUD DETECTION SYSTEM</p>

        <div class="input-group">
            <label>USERNAME</label>
            <input type="text" id="username" placeholder="Enter username">
        </div>

        <div class="input-group">
            <label>PASSWORD</label>
            <input type="password" id="password" placeholder="Enter password">
        </div>

        <div class="password-guide">
            <strong>Password Policy:</strong>
            <ul>
                <li>Minimum 8 characters</li>
                <li>At least 1 uppercase letter</li>
                <li>At least 1 number</li>
                <li>At least 1 special character (@#$%^&+=!)</li>
            </ul>
        </div>

        <button onclick="login()">AUTHENTICATE</button>
        <div class="error" id="error">Invalid credentials</div>

        <div class="register-link">
            No account? <a href="register.html">Register here</a>
        </div>
    </div>

    <script>
        async function login() {
            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;
            const errorDiv = document.getElementById("error");

            if (!username || !password) {
                errorDiv.style.display = "block";
                errorDiv.textContent = "Please enter username and password";
                return;
            }

            try {
                const response = await fetch("http://localhost:8080/api/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password })
                });

                const result = await response.json();

                if (result.success) {
                    sessionStorage.setItem("isLoggedIn", "true");
                    sessionStorage.setItem("fullName", result.fullName || username);
                    window.location.href = "dashboard.html";
                } else {
                    errorDiv.style.display = "block";
                    errorDiv.textContent = result.message;
                }
            } catch (e) {
                errorDiv.style.display = "block";
                errorDiv.textContent = "Server error. Backend may be offline.";
            }
        }

        document.addEventListener("keypress", function(e) {
            if (e.key === "Enter") login();
        });
    </script>
</body>
</html>
