<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Transaction Checker - Fraud Detection System</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Rajdhani:wght@400;500;600;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #05070f;
            color: #e0e6ed;
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(0, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        .navbar {
            position: relative;
            z-index: 10;
            background: rgba(10, 15, 30, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0, 255, 255, 0.25);
            padding: 14px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            font-family: 'Orbitron', sans-serif;
            color: #00f0ff;
            font-size: 18px;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }

        .nav-links {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .nav-links a, .nav-links button {
            font-family: 'Rajdhani', sans-serif;
            color: #cfd8e3;
            text-decoration: none;
            background: rgba(0, 255, 255, 0.08);
            border: 1px solid rgba(0, 255, 255, 0.25);
            padding: 7px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.25s;
        }

        .nav-links a:hover {
            background: rgba(0, 255, 255, 0.18);
            box-shadow: 0 0 12px rgba(0, 255, 255, 0.25);
        }

        .logout-btn {
            background: rgba(255, 50, 80, 0.15) !important;
            border-color: rgba(255, 50, 80, 0.4) !important;
            color: #ff6b8a !important;
        }

        .user-info {
            color: #7f8ea3;
            font-size: 13px;
            margin-right: 6px;
        }

        .container {
            position: relative;
            z-index: 5;
            max-width: 720px;
            margin: 40px auto;
            padding: 0 18px;
        }

        .card {
            background: rgba(12, 18, 35, 0.85);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 14px;
            padding: 28px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.4);
        }

        .card h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            color: #00f0ff;
            margin-bottom: 6px;
            letter-spacing: 1px;
        }

        .card > p {
            color: #7f8ea3;
            margin-bottom: 24px;
            font-size: 14px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 12px;
            color: #7f8ea3;
            letter-spacing: 0.5px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 11px 13px;
            background: rgba(5, 10, 25, 0.8);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 8px;
            color: #e0e6ed;
            font-size: 14px;
            font-family: 'Rajdhani', sans-serif;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #00f0ff;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
        }

        .btn-check {
            width: 100%;
            padding: 13px;
            margin-top: 22px;
            background: linear-gradient(90deg, #00b0ff, #00e5ff);
            color: #001a22;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            font-family: 'Rajdhani', sans-serif;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: 0.25s;
        }

        .btn-check:hover:not(:disabled) {
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.4);
        }

        .btn-check:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(0, 26, 34, 0.3);
            border-top: 2px solid #001a22;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .result-box {
            margin-top: 22px;
            padding: 18px;
            border-radius: 10px;
            display: none;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-normal {
            background: rgba(0, 230, 118, 0.1);
            border: 1px solid #00e676;
            color: #00e676;
        }

        .result-suspicious {
            background: rgba(255, 82, 82, 0.1);
            border: 1px solid #ff5252;
            color: #ff5252;
        }

        .result-box h3 {
            margin-bottom: 10px;
            font-size: 16px;
            font-family: 'Orbitron', sans-serif;
        }

        .score {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            font-weight: 700;
            margin: 8px 0;
        }

        .reasons {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid rgba(255,255,255,0.1);
            font-size: 13px;
            color: #a0aec0;
        }

        .reasons ul {
            margin-top: 6px;
            padding-left: 18px;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <h2>FRAUD DETECTION // COMMAND CENTER</h2>
        <div class="nav-links">
            <span class="user-info" id="userName">ADMIN</span>
            <a href="dashboard.html">Dashboard</a>
            <a href="index.html">Checker</a>
            <a href="history.html">History</a>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </div>

    <div class="container">
        <div class="card">
            <h1>TRANSACTION RISK CHECKER</h1>
            <p>Manual analysis module — enter transaction details for real-time risk assessment</p>

            <div class="form-grid">
                <div class="form-group">
                    <label>ACCOUNT NUMBER</label>
                    <input type="text" id="accountNumber" placeholder="e.g. 1234567890">
                </div>
                <div class="form-group">
                    <label>AMOUNT (RM)</label>
                    <input type="number" id="amount" placeholder="e.g. 15000">
                </div>
                <div class="form-group">
                    <label>TRANSACTION TYPE</label>
                    <select id="transactionType">
                        <option value="TRANSFER">TRANSFER</option>
                        <option value="WITHDRAWAL">WITHDRAWAL</option>
                        <option value="PAYMENT">PAYMENT</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>LOCATION</label>
                    <input type="text" id="location" placeholder="e.g. Kuala Lumpur">
                </div>
            </div>

            <button class="btn-check" id="analyzeBtn" onclick="checkTransaction()">
                <div class="spinner" id="spinner"></div>
                <span id="btnText">ANALYZE TRANSACTION</span>
            </button>

            <div id="result" class="result-box"></div>
        </div>
    </div>

    <script>
        if (sessionStorage.getItem("isLoggedIn") !== "true") {
            window.location.href = "login.html";
        }

        document.getElementById("userName").textContent =
            (sessionStorage.getItem("fullName") || "ADMIN").toUpperCase();

        function logout() {
            sessionStorage.clear();
            window.location.href = "login.html";
        }

        // Auto logout 2 min
        let inactivityTime = 2 * 60 * 1000;
        let logoutTimer;
        function resetLogoutTimer() {
            clearTimeout(logoutTimer);
            logoutTimer = setTimeout(() => {
                sessionStorage.clear();
                alert("Session expired due to inactivity.");
                window.location.href = "login.html";
            }, inactivityTime);
        }
        window.onload = resetLogoutTimer;
        document.onmousemove = resetLogoutTimer;
        document.onkeypress = resetLogoutTimer;
        document.onclick = resetLogoutTimer;
        document.onscroll = resetLogoutTimer;

        async function checkTransaction() {
            const accountNumber = document.getElementById("accountNumber").value;
            const amount = document.getElementById("amount").value;
            const location = document.getElementById("location").value;

            if (!accountNumber || !amount || !location) {
                alert("Please fill in all fields");
                return;
            }

            const btn = document.getElementById("analyzeBtn");
            const spinner = document.getElementById("spinner");
            const btnText = document.getElementById("btnText");

            btn.disabled = true;
            spinner.style.display = "block";
            btnText.textContent = "SCANNING...";
            document.getElementById("result").style.display = "none";

            try {
                const data = {
                    accountNumber: accountNumber,
                    amount: parseFloat(amount),
                    transactionType: document.getElementById("transactionType").value,
                    location: location
                };

                await new Promise(r => setTimeout(r, 700));

                const response = await fetch("http://localhost:8080/api/transactions/check", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                const resultDiv = document.getElementById("result");
                resultDiv.style.display = "block";

                let reasonsHtml = "";
                if (result.reasons && result.reasons.length > 0) {
                    reasonsHtml = `
                        <div class="reasons">
                            <strong>Detection Reasons:</strong>
                            <ul>${result.reasons.map(r => `<li>${r}</li>`).join("")}</ul>
                        </div>
                    `;
                }

                if (result.status === "SUSPICIOUS") {
                    resultDiv.className = "result-box result-suspicious";
                    resultDiv.innerHTML = `
                        <h3>⚑ FLAGGED TRANSACTION</h3>
                        <div class="score">${result.riskScore}%</div>
                        <p><strong>Status:</strong> ${result.status}</p>
                        <p><strong>ID:</strong> ${result.id} &nbsp;|&nbsp; <strong>Account:</strong> ${result.accountNumber}</p>
                        ${reasonsHtml}
                    `;
                } else {
                    resultDiv.className = "result-box result-normal";
                    resultDiv.innerHTML = `
                        <h3>✓ CLEARED TRANSACTION</h3>
                        <div class="score">${result.riskScore}%</div>
                        <p><strong>Status:</strong> ${result.status}</p>
                        <p><strong>ID:</strong> ${result.id} &nbsp;|&nbsp; <strong>Account:</strong> ${result.accountNumber}</p>
                        ${reasonsHtml}
                    `;
                }
            } catch (e) {
                alert("Connection error. Ensure backend is running.");
            }

            btn.disabled = false;
            spinner.style.display = "none";
            btnText.textContent = "ANALYZE TRANSACTION";
        }
    </script>
</body>
</html>
