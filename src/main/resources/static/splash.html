<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fraud Detection System</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Rajdhani:wght@500;600&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #03050c;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Orbitron', sans-serif;
        }

        /* Circuit grid background */
        .circuit-bg {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(0, 255, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.04) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            from { background-position: 0 0; }
            to { background-position: 50px 50px; }
        }

        /* Glowing circuit lines */
        .circuit-bg::before {
            content: "";
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(circle at 20% 30%, rgba(0, 240, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(0, 150, 255, 0.06) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(0, 255, 200, 0.05) 0%, transparent 50%);
        }

        .content {
            position: relative;
            z-index: 10;
            text-align: center;
            animation: fadeInUp 1.2s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 25px;
            border: 2px solid #00f0ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.4), inset 0 0 20px rgba(0, 240, 255, 0.1);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 20px rgba(0, 240, 255, 0.3), inset 0 0 15px rgba(0, 240, 255, 0.1); }
            50% { box-shadow: 0 0 40px rgba(0, 240, 255, 0.6), inset 0 0 25px rgba(0, 240, 255, 0.2); }
        }

        .logo-icon span {
            font-size: 28px;
            color: #00f0ff;
        }

        h1 {
            color: #00f0ff;
            font-size: 28px;
            letter-spacing: 3px;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.5);
        }

        .subtitle {
            font-family: 'Rajdhani', sans-serif;
            color: #7f8ea3;
            font-size: 16px;
            letter-spacing: 4px;
            margin-bottom: 40px;
        }

        .loading-bar {
            width: 220px;
            height: 3px;
            background: rgba(0, 255, 255, 0.15);
            border-radius: 2px;
            margin: 0 auto;
            overflow: hidden;
        }

        .loading-bar .fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00b0ff, #00f0ff);
            box-shadow: 0 0 10px #00f0ff;
            animation: load 2.8s ease forwards;
        }

        @keyframes load {
            to { width: 100%; }
        }

        .status {
            font-family: 'Rajdhani', sans-serif;
            color: #4a5568;
            font-size: 12px;
            margin-top: 15px;
            letter-spacing: 2px;
        }

        /* Fade out whole screen */
        body.fade-out {
            animation: fadeOut 0.8s ease forwards;
        }

        @keyframes fadeOut {
            to { opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="circuit-bg"></div>

    <div class="content">
        <div class="logo-icon">
            <span>◈</span>
        </div>
        <h1>FRAUD DETECTION</h1>
        <div class="subtitle">SYSTEM INITIALIZING</div>
        <div class="loading-bar">
            <div class="fill"></div>
        </div>
        <div class="status">ESTABLISHING SECURE CONNECTION...</div>
    </div>

    <script>
        // After loading animation, fade out and go to login
        setTimeout(() => {
            document.body.classList.add("fade-out");
            setTimeout(() => {
                window.location.href = "login.html";
            }, 800);
        }, 3200);
    </script>
</body>
</html>
