<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Harmonia Bank</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Fraunces:wght@500;600&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            overflow: hidden;
            background: #e8e0d6;
            font-family: 'DM Sans', sans-serif;
            color: #2c2926;
        }

        .stage {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: grid;
            place-items: center;
            background:
                radial-gradient(ellipse 80% 60% at 50% 45%, #f7f1ea 0%, #e8e0d6 55%, #d9cfc3 100%);
        }

        /* Soft base glow */
        .glow {
            position: absolute;
            width: 55vmin;
            height: 55vmin;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,249,243,0.9) 0%, rgba(232,224,214,0) 70%);
            filter: blur(8px);
            animation: pulseGlow 4s ease-in-out infinite;
            z-index: 1;
        }

        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); opacity: 0.75; }
            50% { transform: scale(1.08); opacity: 1; }
        }

        /* Mist layers */
        .mist {
            position: absolute;
            border-radius: 50%;
            filter: blur(28px);
            opacity: 0.55;
            will-change: transform, opacity;
            z-index: 2;
        }

        .mist-1 {
            width: 70vmin; height: 42vmin;
            background: rgba(255, 249, 243, 0.75);
            top: 8%; left: -10%;
            animation: swirl1 5.5s ease-in-out forwards;
        }
        .mist-2 {
            width: 60vmin; height: 38vmin;
            background: rgba(200, 184, 168, 0.45);
            bottom: 5%; right: -8%;
            animation: swirl2 5.5s ease-in-out forwards;
        }
        .mist-3 {
            width: 50vmin; height: 50vmin;
            background: rgba(143, 175, 158, 0.28);
            top: 20%; right: 5%;
            animation: swirl3 5.5s ease-in-out forwards;
        }
        .mist-4 {
            width: 55vmin; height: 36vmin;
            background: rgba(196, 132, 92, 0.18);
            bottom: 18%; left: 0%;
            animation: swirl4 5.5s ease-in-out forwards;
        }
        .mist-5 {
            width: 40vmin; height: 40vmin;
            background: rgba(255, 255, 255, 0.35);
            top: 35%; left: 30%;
            animation: swirl5 5.5s ease-in-out forwards;
        }

        /* Drift inward toward center */
        @keyframes swirl1 {
            0%   { transform: translate(-25%, -15%) rotate(0deg) scale(1.25); opacity: 0.35; }
            55%  { transform: translate(8%, 12%) rotate(25deg) scale(1); opacity: 0.65; }
            100% { transform: translate(35%, 30%) rotate(40deg) scale(0.55); opacity: 0; }
        }
        @keyframes swirl2 {
            0%   { transform: translate(25%, 20%) rotate(0deg) scale(1.3); opacity: 0.3; }
            55%  { transform: translate(-10%, -8%) rotate(-30deg) scale(1); opacity: 0.6; }
            100% { transform: translate(-30%, -25%) rotate(-50deg) scale(0.5); opacity: 0; }
        }
        @keyframes swirl3 {
            0%   { transform: translate(30%, -20%) rotate(0deg) scale(1.2); opacity: 0.25; }
            55%  { transform: translate(-5%, 10%) rotate(35deg) scale(0.95); opacity: 0.5; }
            100% { transform: translate(-25%, 20%) rotate(55deg) scale(0.45); opacity: 0; }
        }
        @keyframes swirl4 {
            0%   { transform: translate(-20%, 25%) rotate(0deg) scale(1.25); opacity: 0.28; }
            55%  { transform: translate(12%, -5%) rotate(-20deg) scale(1); opacity: 0.55; }
            100% { transform: translate(28%, -28%) rotate(-40deg) scale(0.5); opacity: 0; }
        }
        @keyframes swirl5 {
            0%   { transform: translate(10%, 5%) scale(1.4); opacity: 0.2; }
            50%  { transform: translate(0%, 0%) scale(1); opacity: 0.55; }
            100% { transform: translate(0%, 0%) scale(0.3); opacity: 0; }
        }

        /* Center brand content */
        .content {
            position: relative;
            z-index: 5;
            text-align: center;
            opacity: 0;
            transform: scale(0.92);
            animation: revealContent 1.4s ease forwards 2.6s;
        }

        @keyframes revealContent {
            0%   { opacity: 0; transform: scale(0.92) translateY(12px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .mark {
            width: 72px;
            height: 72px;
            margin: 0 auto 18px;
            border-radius: 22px;
            background: linear-gradient(145deg, #4a6b5c, #3a5649);
            color: #fff9f3;
            display: grid;
            place-items: center;
            font-family: 'Fraunces', serif;
            font-size: 30px;
            font-weight: 600;
            box-shadow: 0 12px 30px rgba(74, 107, 92, 0.25);
        }

        h1 {
            font-family: 'Fraunces', serif;
            font-size: clamp(28px, 5vw, 40px);
            font-weight: 600;
            letter-spacing: -0.02em;
            color: #2c2926;
            margin-bottom: 8px;
        }

        p {
            color: #7a7168;
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 22px;
        }

        .line {
            width: 0;
            height: 2px;
            margin: 0 auto 18px;
            border-radius: 2px;
            background: linear-gradient(90deg, transparent, #4a6b5c, transparent);
            animation: growLine 1s ease forwards 3.2s;
        }

        @keyframes growLine {
            from { width: 0; }
            to { width: 120px; }
        }

        .hint {
            font-size: 12px;
            color: #9a9086;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeHint 1s ease forwards 3.6s;
        }

        @keyframes fadeHint {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Final veil lifts away */
        .veil {
            position: absolute;
            inset: 0;
            background: #e8e0d6;
            z-index: 8;
            opacity: 1;
            animation: liftVeil 1.2s ease forwards 0.2s;
            pointer-events: none;
        }

        @keyframes liftVeil {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* Exit fade to next page */
        body.leaving .stage {
            animation: exitOut 0.9s ease forwards;
        }

        @keyframes exitOut {
            to { opacity: 0; transform: scale(1.03); }
        }
    </style>
</head>
<body>
    <div class="stage">
        <div class="veil"></div>

        <div class="mist mist-1"></div>
        <div class="mist mist-2"></div>
        <div class="mist mist-3"></div>
        <div class="mist mist-4"></div>
        <div class="mist mist-5"></div>

        <div class="glow"></div>

        <div class="content">
            <div class="mark">H</div>
            <h1>Harmonia Bank</h1>
            <div class="line"></div>
            <p>Quiet security. Clear detection.</p>
            <div class="hint">Entering secure portal</div>
        </div>
    </div>

    <script>
        // Mist gathers → brand reveals → soft exit to access page
        setTimeout(() => {
            document.body.classList.add("leaving");
            setTimeout(() => {
                window.location.href = "access.html";
            }, 850);
        }, 4800);
    </script>
</body>
</html>
