<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Transaction History - Fraud Detection System</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Rajdhani:wght@400;500;600;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #05070f;
            color: #e0e6ed;
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(0, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        .navbar {
            position: relative;
            z-index: 10;
            background: rgba(10, 15, 30, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0, 255, 255, 0.25);
            padding: 14px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            font-family: 'Orbitron', sans-serif;
            color: #00f0ff;
            font-size: 18px;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }

        .nav-links {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .nav-links a, .nav-links button {
            font-family: 'Rajdhani', sans-serif;
            color: #cfd8e3;
            text-decoration: none;
            background: rgba(0, 255, 255, 0.08);
            border: 1px solid rgba(0, 255, 255, 0.25);
            padding: 7px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.25s;
        }

        .nav-links a:hover {
            background: rgba(0, 255, 255, 0.18);
            box-shadow: 0 0 12px rgba(0, 255, 255, 0.25);
        }

        .logout-btn {
            background: rgba(255, 50, 80, 0.15) !important;
            border-color: rgba(255, 50, 80, 0.4) !important;
            color: #ff6b8a !important;
        }

        .user-info {
            color: #7f8ea3;
            font-size: 13px;
            margin-right: 6px;
        }

        .container {
            position: relative;
            z-index: 5;
            max-width: 1250px;
            margin: 30px auto;
            padding: 0 18px;
        }

        .card {
            background: rgba(12, 18, 35, 0.85);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 14px;
            padding: 24px;
            backdrop-filter: blur(10px);
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            color: #00f0ff;
            margin-bottom: 18px;
            letter-spacing: 1px;
        }

        /* Filter Bar */
        .filter-bar {
            display: flex;
            gap: 12px;
            align-items: flex-end;
            margin-bottom: 20px;
            flex-wrap: wrap;
            padding: 14px;
            background: rgba(5, 10, 25, 0.6);
            border-radius: 10px;
            border: 1px solid rgba(0, 255, 255, 0.12);
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .filter-group label {
            font-size: 11px;
            color: #7f8ea3;
            letter-spacing: 0.5px;
        }

        .filter-group input {
            padding: 8px 12px;
            background: rgba(5, 10, 25, 0.8);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 6px;
            color: #e0e6ed;
            font-family: 'Rajdhani', sans-serif;
            font-size: 13px;
        }

        .filter-group input:focus {
            outline: none;
            border-color: #00f0ff;
        }

        .btn-filter {
            padding: 8px 16px;
            background: linear-gradient(90deg, #00b0ff, #00e5ff);
            color: #001a22;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            font-family: 'Rajdhani', sans-serif;
            font-size: 13px;
            cursor: pointer;
        }

        .btn-clear {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.08);
            color: #cfd8e3;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 6px;
            font-weight: 600;
            font-family: 'Rajdhani', sans-serif;
            font-size: 13px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 11px 9px;
            text-align: left;
            border-bottom: 1px solid rgba(0, 255, 255, 0.1);
            font-size: 13px;
        }

        th {
            background: rgba(5, 10, 25, 0.6);
            color: #7f8ea3;
            font-weight: 600;
            letter-spacing: 0.5px;
            font-size: 12px;
        }

        tr:hover {
            background: rgba(0, 255, 255, 0.04);
        }

        .status-normal { color: #00e676; font-weight: 700; }
        .status-suspicious { color: #ff5252; font-weight: 700; }
        .status-false { color: #ffd600; font-weight: 700; }

        .btn-fp {
            background: rgba(255, 214, 0, 0.15);
            color: #ffd600;
            border: 1px solid rgba(255, 214, 0, 0.4);
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Rajdhani', sans-serif;
        }

        .btn-fp:hover {
            background: rgba(255, 214, 0, 0.25);
        }

        .loading, .empty-msg {
            text-align: center;
            padding: 50px;
            color: #4a5568;
        }

        .result-count {
            font-size: 13px;
            color: #7f8ea3;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <h2>FRAUD DETECTION // COMMAND CENTER</h2>
        <div class="nav-links">
            <span class="user-info" id="userName">ADMIN</span>
            <a href="dashboard.html">Dashboard</a>
            <a href="index.html">Checker</a>
            <a href="history.html">History</a>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </div>

    <div class="container">
        <div class="card">
            <h1>TRANSACTION HISTORY LOG</h1>

            <!-- Date Filter -->
            <div class="filter-bar">
                <div class="filter-group">
                    <label>FROM DATE</label>
                    <input type="date" id="fromDate">
                </div>
                <div class="filter-group">
                    <label>TO DATE</label>
                    <input type="date" id="toDate">
                </div>
                <button class="btn-filter" onclick="applyFilter()">APPLY FILTER</button>
                <button class="btn-clear" onclick="clearFilter()">CLEAR</button>
            </div>

            <div class="result-count" id="resultCount"></div>
            <div id="content">
                <div class="loading">Loading history records...</div>
            </div>
        </div>
    </div>

    <script>
        if (sessionStorage.getItem("isLoggedIn") !== "true") {
            window.location.href = "login.html";
        }

        document.getElementById("userName").textContent =
            (sessionStorage.getItem("fullName") || "ADMIN").toUpperCase();

        function logout() {
            sessionStorage.clear();
            window.location.href = "login.html";
        }

        // Auto logout 2 min
        let inactivityTime = 2 * 60 * 1000;
        let logoutTimer;
        function resetLogoutTimer() {
            clearTimeout(logoutTimer);
            logoutTimer = setTimeout(() => {
                sessionStorage.clear();
                alert("Session expired due to inactivity.");
                window.location.href = "login.html";
            }, inactivityTime);
        }
        window.onload = resetLogoutTimer;
        document.onmousemove = resetLogoutTimer;
        document.onkeypress = resetLogoutTimer;
        document.onclick = resetLogoutTimer;
        document.onscroll = resetLogoutTimer;

        let allTransactions = [];

        async function markFalsePositive(id) {
            if (!confirm("Mark this transaction as False Positive?")) return;

            try {
                const response = await fetch(`http://localhost:8080/api/transactions/${id}/false-positive`, {
                    method: "PUT"
                });
                const result = await response.json();

                if (result.success) {
                    alert("Marked as False Positive");
                    loadHistory();
                } else {
                    alert(result.message);
                }
            } catch (e) {
                alert("Failed to update");
            }
        }

        function renderTable(data) {
            if (data.length === 0) {
                document.getElementById("content").innerHTML = "<div class='empty-msg'>No transactions found for the selected range.</div>";
                document.getElementById("resultCount").textContent = "";
                return;
            }

            document.getElementById("resultCount").textContent = `Showing ${data.length} transaction(s)`;

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>ACCOUNT</th>
                            <th>AMOUNT</th>
                            <th>TYPE</th>
                            <th>LOCATION</th>
                            <th>RISK</th>
                            <th>STATUS</th>
                            <th>TIME</th>
                            <th>ACTION</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            data.forEach(tx => {
                let statusClass = "status-normal";
                let statusText = "CLEARED";

                if (tx.falsePositive) {
                    statusClass = "status-false";
                    statusText = "FALSE POSITIVE";
                } else if (tx.status === "SUSPICIOUS") {
                    statusClass = "status-suspicious";
                    statusText = "FLAGGED";
                }

                let actionBtn = "";
                if (tx.status === "SUSPICIOUS" && !tx.falsePositive) {
                    actionBtn = `<button class="btn-fp" onclick="markFalsePositive(${tx.id})">Mark FP</button>`;
                }

                html += `
                    <tr>
                        <td>${tx.id}</td>
                        <td>${tx.accountNumber}</td>
                        <td>RM ${Number(tx.amount).toFixed(2)}</td>
                        <td>${tx.transactionType}</td>
                        <td>${tx.location}</td>
                        <td>${tx.riskScore}%</td>
                        <td class="${statusClass}">${statusText}</td>
                        <td>${tx.timestamp ? tx.timestamp.replace("T", " ").substring(0, 19) : "-"}</td>
                        <td>${actionBtn}</td>
                    </tr>
                `;
            });

            html += `</tbody></table>`;
            document.getElementById("content").innerHTML = html;
        }

        function applyFilter() {
            const fromDate = document.getElementById("fromDate").value;
            const toDate = document.getElementById("toDate").value;

            let filtered = [...allTransactions];

            if (fromDate) {
                const from = new Date(fromDate);
                from.setHours(0, 0, 0, 0);
                filtered = filtered.filter(tx => {
                    if (!tx.timestamp) return false;
                    return new Date(tx.timestamp) >= from;
                });
            }

            if (toDate) {
                const to = new Date(toDate);
                to.setHours(23, 59, 59, 999);
                filtered = filtered.filter(tx => {
                    if (!tx.timestamp) return false;
                    return new Date(tx.timestamp) <= to;
                });
            }

            // Newest first
            filtered.reverse();
            renderTable(filtered);
        }

        function clearFilter() {
            document.getElementById("fromDate").value = "";
            document.getElementById("toDate").value = "";
            renderTable([...allTransactions].reverse());
        }

        async function loadHistory() {
            try {
                const response = await fetch("http://localhost:8080/api/transactions/history");
                allTransactions = await response.json();

                if (allTransactions.length === 0) {
                    document.getElementById("content").innerHTML = "<div class='empty-msg'>No transactions recorded yet.</div>";
                    return;
                }

                renderTable([...allTransactions].reverse());
            } catch (e) {
                document.getElementById("content").innerHTML = "<div class='empty-msg' style='color:#ff5252;'>Error loading history.</div>";
            }
        }

        loadHistory();
    </script>
</body>
</html>
